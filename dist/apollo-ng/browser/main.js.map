<p-dialog
    [modal]="true"
    [visible]="visible"
    (visibleChange)="onVisibleChange($event)"
    header="Profile settings"
    [style]="{ width: '32rem' }"
    [draggable]="false"
    styleClass="profile-settings-dialog"
>
    @if (loading) {
        <div class="profile-settings-loading">Loading…</div>
    }

    @if (!loading) {
        <div class="profile-settings-form flex flex-col gap-4">
            <div class="flex flex-col items-center gap-2">
                <p-avatar [image]="avatarImage" shape="circle" [style]="{ width: '96px', height: '96px' }" />
                <input
                    #photoInput
                    type="file"
                    accept="image/*"
                    class="profile-photo-input"
                    (change)="onPhotoSelected($event)"
                />
                <p-button
                    type="button"
                    label="Change profile photo"
                    [text]="true"
                    [loading]="uploadingPhoto"
                    [disabled]="uploadingPhoto || saving"
                    (onClick)="photoInput.click()"
                />
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-semibold text-sm" for="profileFirstName">First name</label>
                <input
                    pInputText
                    id="profileFirstName"
                    class="w-full"
                    [(ngModel)]="firstName"
                    [disabled]="saving"
                    autocomplete="given-name"
                />
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-semibold text-sm" for="profileLastName">Last name</label>
                <input
                    pInputText
                    id="profileLastName"
                    class="w-full"
                    [(ngModel)]="lastName"
                    [disabled]="saving"
                    autocomplete="family-name"
                />
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-semibold text-sm" for="profileEmail">Email</label>
                <input
                    pInputText
                    id="profileEmail"
                    type="email"
                    class="w-full"
                    [(ngModel)]="email"
                    [disabled]="saving"
                    autocomplete="email"
                />
            </div>

            <div class="flex flex-col gap-1 profile-phone-field">
                <label class="font-semibold text-sm" for="profilePhone">Phone number</label>
                <input
                    pInputText
                    id="profilePhone"
                    class="w-full profile-phone-non-editable"
                    [(ngModel)]="phoneNumber"
                    [disabled]="true"
                    [attr.aria-readonly]="true"
                />
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-semibold text-sm" for="profileAddress">Address</label>
                <input
                    pInputText
                    id="profileAddress"
                    class="w-full"
                    [(ngModel)]="address"
                    [disabled]="saving"
                    autocomplete="street-address"
                />
            </div>

            <div class="flex w-full justify-end gap-2 pt-2">
                <p-button
                    type="button"
                    label="Cancel"
                    severity="secondary"
                    [disabled]="saving || loading"
                    (onClick)="close()"
                />
                <p-button
                    type="button"
                    label="Save"
                    [loading]="saving"
                    [disabled]="loading || uploadingPhoto"
                    (onClick)="save()"
                />
            </div>
        </div>
    }
</p-dialog>
